name: NodeJS with Webpack

on:
  push:
    branches: ["main"]
  #pull_request:
  #branches: ["main"]
# Add this near the top of your workflow file (at the job or workflow level)
permissions:
  contents: write
env:
  # This provides authentication to the gh-pages npm package
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: deploy to github pages
        run: |
          npm install --force or --legacy-peer-deps
          npm run build
          npm run deploy
